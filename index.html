<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Hide and Seek</title>
  <link rel="stylesheet" href="style.css">
  <!-- Backup styles so the page still fills the screen if style.css is slow to load -->
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111111;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #gameCanvas {
      display: block;
      background: #111111;
      touch-action: none;
    }
  </style>
</head>
<body>
  <!-- The canvas is where we draw the room and the player -->
  <canvas id="gameCanvas"></canvas>
  <script src="game.js"></script>
</body>
</html>
